url: https://teindor.github.io/dmsa

template:
  bootstrap: 5
  includes:
    in_header: |
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "dmsa",
        "alternateName": "Directional Methylation Set Analysis",
        "description": "Directional Methylation Set Analysis (DMSA) is an R package for gene-set and system-level analysis of DNA methylation array data. Before aggregating, DMSA aligns each probe's effect to that probe's predicted consequence for gene expression, so probes predicted to raise expression and probes predicted to lower it are no longer averaged against each other. Each unit's statistic is computed from that unit's own probes alone, and multiplicity is corrected only within level-local families. In a benchmark where opposing effects cancelled under conventional aggregation, DMSA reached 84% power against 7-8% for camera, fry and over-representation alternatives, and reported the correct biological direction in 100% of its detections. Where the question was instead whether a whole panel was associated, DMSA's pooled score stayed silent while globaltest correctly rejected.",
        "codeRepository": "https://github.com/teindor/dmsa",
        "programmingLanguage": { "@type": "ComputerLanguage", "name": "R" },
        "license": "https://spdx.org/licenses/MIT.html",
        "identifier": "https://doi.org/10.5281/zenodo.22023957",
        "applicationCategory": "Bioinformatics",
        "keywords": ["DNA methylation","gene set analysis","epigenetics",
                     "EWAS","directional inference","permutation testing"],
        "author": {
          "@type": "Person",
          "name": "Tsachi Ein-Dor",
          "identifier": "https://orcid.org/0000-0002-3078-7591",
          "affiliation": {
            "@type": "Organization",
            "name": "Reichman University"
          }
        }
      }
      </script>

home:
  title: dmsa - Directional Methylation Set Analysis
  description: >
    Aligns probe-level DNA methylation effects to their predicted consequence
    for gene expression before aggregating, tests each unit through three
    pre-specified lenses on one permutation stream, and names the responsible
    gene inside level-local families with family-wise error control.

